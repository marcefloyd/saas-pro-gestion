<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - Ejemplo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-md w-96 border dark:border-gray-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-pink-600 dark:text-pink-400">Acceso Administrador</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Correo electrónico</label>
                <input type="email" id="login-email" required class="mt-1 w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-pink-500 focus:border-pink-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña</label>
                <input type="password" id="login-password" required class="mt-1 w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-pink-500 focus:border-pink-500">
            </div>
            <button type="submit" class="w-full bg-pink-600 text-white p-2 rounded-md hover:bg-pink-700 font-medium">Ingresar</button>
            <p id="login-error" class="text-red-500 text-sm text-center mt-2"></p>
        </form>
    </div>

    <!-- Vinculado al JS de login con Supabase -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
